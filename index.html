<style>

<script>
"use strict";
const W=960,H=600,HOUR_LEN=42,PANMAX=140;
const cv=document.getElementById('cv'),g=cv.getContext('2d');
const stage=document.getElementById('stage');
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);stage.style.transform='scale('+s+')';}
addEventListener('resize',fit);fit();

let state='menu',night=1,saveNight=1,frame=0,T=0,fanA=0,eyeT=0,alt=false,killer='',jumpT=0,introT=0,menuGlitch=0;
try{saveNight=Math.min(5,parseInt(localStorage.getItem('vhn_save'))||1)}catch(e){}
let mouse={x:W/2,y:H/2},uiButtons=[],hoverAny=false,toasts=[],S=null;

const CALL_LINES=[
'Алло? Алло, алло! Это Пупук. Ну, тот самый. Дефолтный.',
'Ты новый охранник «Воздуханчиков». Поздравляю. Наверное.',
'Правило раз: увидел два огромных красных глаза — это Пубертата, Бинитата на высокой стадии пубертата. Закрывай ЛЕВУЮ дверь. Быстро.',
'Правило два: проверяй люк. Там лезет Шлепандрей. Кидай в него макароны по-флотски, пока он тебя не схавал.',
'Правило три: если планшет взломали — это Изиг. Закрывай ОБЕ двери и жди конца атаки. Не открывай.',
'Правило четыре: видишь типа, который танцует «бана сливы виноград»? Это Палек. Выпил три с половиной литра кумыза. Следи за ним на камере танцпола — пусть танцует, а не бегает.',
'И запомни: следи за энергией. В темноте прихожу я. Пупук.',
'Удачи, охранник. Не сдавайся.'];
const KILLERS={bin:'ПУБЕРТАТА',shlep:'ШЛЕПАНДРЕЙ',palek:'ПАЛЕК (АРТЕМ)',izig:'ИЗИГ',pup:'ПУПУК'};
const TIPS={bin:'Два огромных красных глаза — закрывай ЛЕВУЮ дверь. Пубертата не прощает.',shlep:'Проверяй люк и кидай макароны по-флотски. Голодный Шлепандрей милосердия не знает.',palek:'Следи за Палеком на танцполе. Пусть танцует «бана сливы виноград», а не бегает к тебе.',izig:'Планшет взломан? Закрой ОБЕ двери и не открывай до конца атаки.',pup:'Следи за энергией. В темноте приходит Пупук.'};
const CAMS=[{id:'1A',name:'СЦЕНА'},{id:'1B',name:'ЗАПАДНЫЙ КОРИДОР'},{id:'2',name:'ВЕНТИЛЯЦИЯ'},{id:'3',name:'КЛАДОВКА'},{id:'4',name:'ВОСТОЧНЫЙ КОРИДОР'},{id:'5',name:'ТАНЦПОЛ'},{id:'6',name:'КУХНЯ'}];
const MAPC={'1A':[726,318,88,40],'1B':[652,368,80,38],'3':[652,414,80,38],'6':[740,414,80,38],'2':[742,470,96,40],'4':[830,368,80,38],'5':[826,414,80,38]};
const TUNE=[659,622,659,494,587,554,587,392,659,622,659,494,523,494,440,392];
const JN=[523,659,784,1046,784,659];
const SONG='♪ БАНА СЛИВЫ ВИНОГРАД ♪';
let call={active:false,line:0,t:0,tts:false};
const V1=new Audio(),V2=new Audio();let v1err=false,v2err=false;
V1.preload='auto';V2.preload='auto';V1.src='voice1.mp3';V2.src='voice2.mp3';
V1.addEventListener('error',()=>v1err=true);V2.addEventListener('error',()=>v2err=true);

function freshState(){return{hour:0,hourT:0,elapsed:0,power:100,usage:1,mac:7,doorL:false,doorR:false,lightL:false,lightR:false,hatch:false,tablet:false,cam:0,pan:0,blackout:false,boT:0,tuneT:0,tuneI:0,creakT:8,tut1:false,tut2:false,bin:{pos:0,t:9,atT:0,banged:false},shlep:{pos:0,t:13,ventT:0,scr:0,w1:false},palek:{k:22,st:'dance',rt:0,jt:0,ji:0,warn:false},izig:{t:night===1?70:32,ph:'idle',ht:0,ht0:1,gr:0,at:0},pup:{pos:0,t:11,atT:0,lt:6,on:night>=3}};}
function binInt(){return Math.max(3.5,10-night*0.7+Math.random()*5);}
function shlepInt(){return Math.max(5,13-night*0.8+Math.random()*5);}
function pupInt(){return Math.max(4,9-night*0.6+Math.random()*3);}
function toast(t,d=3){toasts.push({t,d});}

let AC=null,nBuf=null,fanNode=null,buzzNode=null;
function ac(){if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();nBuf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const d=nBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}if(AC.state==='suspended')AC.resume();return AC;}
function tone(f,dur,type,vol,slide,delay){type=type||'sine';vol=vol||0.2;delay=delay||0;try{const c=ac(),t0=c.currentTime+delay,o=c.createOscillator(),gn=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t0);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,slide),t0+dur);gn.gain.setValueAtTime(0.0001,t0);gn.gain.exponentialRampToValueAtTime(vol,t0+0.015);gn.gain.exponentialRampToValueAtTime(0.0001,t0+dur);o.connect(gn);gn.connect(c.destination);o.start(t0);o.stop(t0+dur+0.05);}catch(e){}}
function noiseFx(dur,vol,freq,q,delay){vol=vol||0.2;freq=freq||1200;q=q||0.8;delay=delay||0;try{const c=ac(),t0=c.currentTime+delay,s=c.createBufferSource();s.buffer=nBuf;s.loop=true;const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;f.Q.value=q;const gn=c.createGain();gn.gain.setValueAtTime(0.0001,t0);gn.gain.exponentialRampToValueAtTime(vol,t0+0.02);gn.gain.exponentialRampToValueAtTime(0.0001,t0+dur);s.connect(f);f.connect(gn);gn.connect(c.destination);s.start(t0);s.stop(t0+dur+0.05);}catch(e){}}
function startFan(){try{const c=ac();const s=c.createBufferSource();s.buffer=nBuf;s.loop=true;const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=180;const gn=c.createGain();gn.gain.value=0.05;s.connect(f);f.connect(gn);gn.connect(c.destination);s.start();const o=c.createOscillator();o.type='sine';o.frequency.value=95;const og=c.createGain();og.gain.value=0.012;o.connect(og);og.connect(c.destination);o.start();fanNode={s,o};}catch(e){}}
function stopFan(){if(fanNode){try{fanNode.s.stop();fanNode.o.stop();}catch(e){}fanNode=null;}}
function setBuzz(on){try{if(on&&!buzzNode){const c=ac();const o=c.createOscillator();o.type='sawtooth';o.frequency.value=110;const gn=c.createGain();gn.gain.value=0.015;o.connect(gn);gn.connect(c.destination);o.start();buzzNode={o};}else if(!on&&buzzNode){buzzNode.o.stop();buzzNode=null;}}catch(e){}}
function beep(){tone(1150,0.05,'square',0.07);}
function slam(){noiseFx(0.18,0.5,120,1);tone(75,0.18,'sine',0.5,40);}
function bangDoor(){noiseFx(0.2,0.6,150,1);tone(60,0.25,'sine',0.5,35);}
function plop(){tone(320,0.12,'sine',0.35,90);noiseFx(0.08,0.15,900,1);}
function thump(){tone(85,0.15,'sine',0.2,50);}
function metal(){tone(210,0.3,'square',0.15,180);noiseFx(0.2,0.2,700,1);}
function scratchS(){noiseFx(0.12,0.25,1800,2);}
function staticFx(){noiseFx(0.15,0.2,2500,0.6);}
function laugh(){[340,300,262].forEach((f,i)=>tone(f,0.16,'triangle',0.22,null,i*0.21));}
function runSteps(){for(let i=0;i<6;i++)tone(90,0.07,'sine',0.3,55,i*0.08);}
function alarmBeep(a){tone(a?880:660,0.16,'square',0.12);}
function chime(){[784,988,1175,1568].forEach((f,i)=>tone(f,0.6,'sine',0.18,null,i*0.18));}
function scream(){noiseFx(0.9,0.7,300,0.7);tone(800,0.9,'sawtooth',0.5,120);tone(60,0.9,'square',0.35,45);}
function stopAll(){stopFan();setBuzz(false);try{speechSynthesis.cancel();}catch(e){}try{V1.pause();V2.pause();}catch(e){}}

function startCall(){call.active=true;call.line=0;call.t=0;call.tts=false;
const useTTS=()=>{if(!call.tts){call.tts=true;speakNext();}};
if(!v1err){try{V1.currentTime=0;}catch(e){}
V1.onended=()=>{if(!v2err){try{V2.currentTime=0;}catch(e){}V2.onended=()=>{call.active=false;};V2.play().catch(useTTS);}else{call.active=false;}};
V1.play().catch(useTTS);}
else if(!v2err){try{V2.currentTime=0;}catch(e){}V2.onended=()=>{call.active=false;};V2.play().catch(useTTS);}
else useTTS();}
function speakNext(){if(!call.active)return;if(call.line>=CALL_LINES.length){call.active=false;return;}try{const u=new SpeechSynthesisUtterance(CALL_LINES[call.line]);u.lang='ru-RU';u.rate=0.95;u.pitch=0.75;u.onend=()=>{call.line++;speakNext();};speechSynthesis.speak(u);}catch(e){call.active=false;}}
function skipCall(){call.active=false;try{V1.pause();V2.pause();speechSynthesis.cancel();}catch(e){}}

function startNight(n){night=n;S=freshState();toasts=[];call.active=false;try{speechSynthesis.cancel();}catch(e){}state='intro';introT=0;}
function enterNight(){state='night';startFan();setBuzz(false);if(night===1){startCall();toast('Клавиши: 1/2 — дверь/свет слева, 5/6 — справа, 3 — макароны, 4 — люк',6);}}
function winNight(){state='win';stopAll();chime();saveNight=Math.min(5,night+1);try{localStorage.setItem('vhn_save',saveNight);}catch(e){}}
function jump(k){if(state!=='night')return;state='jump';jumpT=0;killer=k;stopAll();scream();}

function toggleDoor(side){if(state!=='night'||!S||S.blackout)return;if(side==='L')S.doorL=!S.doorL;else S.doorR=!S.doorR;slam();}
function toggleLight(side){if(state!=='night'||!S||S.blackout)return;if(side==='L')S.lightL=!S.lightL;else S.lightR=!S.lightR;setBuzz(S.lightL||S.lightR);}
function toggleHatch(){if(state!=='night'||!S||S.blackout)return;S.hatch=!S.hatch;metal();}
function throwMac(){if(state!=='night'||!S||S.blackout)return;if(S.mac<=0){toast('МАКАРОНЫ ЗАКОНЧИЛИСЬ!');return;}S.mac--;plop();if(S.shlep.pos>=1){S.shlep.pos=0;S.shlep.t=shlepInt()+9;S.shlep.w1=false;toast('ШЛЕПАНДРЕЙ ОТСТУПАЕТ!');}else toast('Макароны потрачены зря...');}
function toggleTablet(){if(state!=='night'||!S||S.blackout||S.izig.ph==='hack')return;S.tablet=!S.tablet;staticFx();}
function switchCam(i){if(S.izig.ph==='hack')return;if(S.cam!==i){S.cam=i;staticFx();}}

const nz=document.createElement('canvas');nz.width=240;nz.height=150;const nzx=nz.getContext('2d');
function refreshNoise(){const d=nzx.createImageData(240,150),b=d.data;for(let i=0;i<b.length;i+=4){const v=Math.random()*255|0;b[i]=v;b[i+1]=v;b[i+2]=v;b[i+3]=255;}nzx.putImageData(d,0,0);}
function drawStatic(a){g.save();g.globalAlpha=a;g.imageSmoothingEnabled=false;g.drawImage(nz,0,0,W,H);g.restore();}
const vig=document.createElement('canvas');vig.width=W;vig.height=H;{const c=vig.getContext('2d');const gr=c.createRadialGradient(W/2,H/2,200,W/2,H/2,620);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,0,0.55)');c.fillStyle=gr;c.fillRect(0,0,W,H);}
function vign(){g.drawImage(vig,0,0);}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function txt(s,x,y,size,color,align,weight,font){align=align||'center';weight=weight||'bold';font=font||'"Courier New",monospace';g.fillStyle=color;g.font=weight+' '+size+'px '+font;g.textAlign=align;g.fillText(s,x,y);}
function uiBtn(x,y,w,h,label,cb,o){o=o||{};const hov=mouse.x>=x&&mouse.x<=x+w&&mouse.y>=y&&mouse.y<=y+h;if(hov)hoverAny=true;rr(g,x,y,w,h,8);g.fillStyle=o.bg||'#232730';g.fill();g.strokeStyle=hov?'#a8adbc':'#454a56';g.lineWidth=2;g.stroke();g.lineWidth=1;if(label){g.fillStyle=o.fg||'#d6d9e0';g.font='bold '+(o.fs||13)+'px "Courier New",monospace';g.textAlign='center';g.fillText(label,x+w/2,y+h/2+5);}if(o.hint){g.fillStyle='#6a6f7a';g.font='10px "Courier New",monospace';g.textAlign='right';g.fillText(o.hint,x+w-6,y+14);}uiButtons.push({x,y,w,h,cb});}
function wrap(s,x,y,maxW,lh,size,color){g.fillStyle=color;g.font='15px "Courier New",monospace';g.textAlign='left';const words=s.split(' ');let line='',yy=y;for(const w of words){const t=line?line+' '+w:w;if(g.measureText(t).width>maxW){g.fillText(line,x,yy);yy+=lh;line=w;}else line=t;}g.fillText(line,x,yy);return yy;}
function hourStr(){return (S.hour===0?12:S.hour)+' АМ';}

function drawFan(x,y,r,a){g.save();g.translate(x,y);g.fillStyle='#20222a';g.fillRect(-6,r*0.4,12,r*0.8);g.beginPath();g.ellipse(0,r*1.15,r*0.55,r*0.13,0,0,7);g.fill();g.strokeStyle='#3a3e4a';g.lineWidth=3;g.beginPath();g.arc(0,0,r,0,7);g.stroke();g.lineWidth=1;g.globalAlpha=0.4;for(let i=0;i<8;i++){g.beginPath();g.moveTo(0,0);g.lineTo(Math.cos(i*0.785)*r,Math.sin(i*0.785)*r);g.stroke();}g.globalAlpha=1;g.fillStyle='#565b6b';for(let i=0;i<3;i++){g.save();g.rotate(a+i*2.094);g.beginPath();g.ellipse(r*0.5,0,r*0.48,r*0.2,0,0,7);g.fill();g.restore();}g.fillStyle='#767c8f';g.beginPath();g.arc(0,0,r*0.16,0,7);g.fill();g.restore();}
function drawPoster(x,y){g.save();g.translate(x,y);g.fillStyle='#0e0e13';rr(g,0,0,116,124,4);g.fill();g.strokeStyle='#2a2a32';g.stroke();txt('НАШИ ХОСТЫ',58,16,9,'#8a8f99','center','bold');const cards=[['БИНИТАТА','#d94b6b'],['ПАЛЕК','#39d3e0'],['ШЛЕПАНДРЕЙ','#c8a06a'],['ИЗИГ','#2fae4f']];cards.forEach((c,i)=>{const cx=10+(i%2)*52,cy=26+((i/2)|0)*46;g.fillStyle=c[1];rr(g,cx,cy,46,36,3);g.fill();g.fillStyle='rgba(0,0,0,0.45)';g.beginPath();g.arc(cx+23,cy+15,9,0,7);g.fill();g.fillStyle='#111';g.font='7px "Courier New",monospace';g.textAlign='center';g.fillText(c[0],cx+23,cy+32);});g.restore();}
function drawPupuk(x,y,s,mad){g.save();g.translate(x,y);g.scale(s,s);g.strokeStyle='#d2a94e';g.lineWidth=5;g.beginPath();g.arc(0,-26,42,Math.PI*1.02,Math.PI*1.98);g.stroke();for(let i=0;i<5;i++){g.beginPath();g.moveTo(-36+i*18,-52);g.lineTo(-30+i*18,-72);g.stroke();}g.lineWidth=1;g.fillStyle='#e6c191';g.beginPath();g.ellipse(0,4,50,56,0,0,7);g.fill();g.beginPath();g.ellipse(-50,6,8,12,0,0,7);g.fill();g.beginPath();g.ellipse(50,6,8,12,0,0,7);g.fill();g.fillStyle='#f6f6f4';g.beginPath();g.ellipse(-19,-12,12,14,0,0,7);g.fill();g.beginPath();g.ellipse(19,-12,12,14,0,0,7);g.fill();g.strokeStyle='#c04040';g.lineWidth=1;g.beginPath();g.moveTo(-25,-18);g.lineTo(-14,-8);g.moveTo(25,-18);g.lineTo(14,-8);g.stroke();if(!mad){g.fillStyle='#39424f';g.beginPath();g.arc(-23,-18,2.5,0,7);g.fill();g.beginPath();g.arc(23,-18,2.5,0,7);g.fill();}g.strokeStyle='#b58a4f';g.lineWidth=3;g.beginPath();g.moveTo(-30,-28);g.lineTo(-10,-32);g.moveTo(30,-28);g.lineTo(10,-32);g.stroke();g.lineWidth=1;g.fillStyle='#c99b68';g.beginPath();g.ellipse(0,6,8,6,0,0,7);g.fill();g.fillStyle='#4a1010';g.beginPath();g.ellipse(0,32,mad?30:22,mad?26:16,0,0,7);g.fill();g.fillStyle='#e8e8e8';rr(g,-16,18,32,7,3);g.fill();g.fillStyle='#e06a8a';g.beginPath();g.ellipse(0,mad?50:44,13,mad?14:10,0,0,7);g.fill();g.restore();}
function drawBinEyes(x,y,s){g.save();g.translate(x,y);for(const dx of[-27,27]){const gr=g.createRadialGradient(dx,0,2,dx,0,26*s);gr.addColorStop(0,'#fff');gr.addColorStop(0.25,'#ff4040');gr.addColorStop(1,'rgba(255,0,0,0)');g.fillStyle=gr;g.beginPath();g.arc(dx,0,26*s,0,7);g.fill();g.fillStyle='#ffd7d7';g.beginPath();g.arc(dx,0,7*s,0,7);g.fill();}g.restore();}

if(S.izig.ph==='hack'){const z=S.izig;g.fillStyle='#01140a';g.fillRect(24,24,592,520);g.font='bold 13px "Courier New",monospace';g.textAlign='left';const glyphs=['0','1','>','#','$','%','&','@'];for(let i=0;i<27;i++){g.fillStyle='rgba(57,255,106,'+(0.1+((i*37)%20)/100)+')';g.fillText(glyphs[(i+((T*4)|0))%8],38+i*21,(T*180+i*97)%540+40);}if(frame%10<7)txt('ВЗЛОМ АКТИВЕН',320,150,36,'#39ff6a');txt('ИЗИГ В СИСТЕМЕ. БОЕВОЙ ПУБЕРТАТ: МАКСИМУМ',320,200,15,'#7dffa8');if(frame%20<12)txt('ЗАКРОЙ ОБЕ ДВЕРИ',320,258,26,'#fff');g.strokeStyle='#2f6b3f';g.strokeRect(120,300,400,14);g.fillStyle='#39ff6a';g.fillRect(122,302,396*Math.max(0,z.ht/z.ht0),10);g.globalAlpha=0.9;drawIzigFace(90,130,0.42);g.globalAlpha=1;uiBtn(120,420,270,70,S.doorL?'ЛЕВАЯ: ЗАКРЫТА':'ЛЕВАЯ: ОТКРЫТА',()=>toggleDoor('L'),{bg:S.doorL?'#a32626':'#20242a',fs:14});uiBtn(520,420,270,70,S.doorR?'ПРАВАЯ: ЗАКРЫТА':'ПРАВАЯ: ОТКРЫТА',()=>toggleDoor('R'),{bg:S.doorR?'#a32626':'#20242a',fs:14});for(let i=0;i<3;i++){const yy=24+Math.random()*500;g.drawImage(cv,0,yy,960,22,(Math.random()-0.5)*60,yy,960,22);}g.fillStyle='rgba(57,255,106,0.05)';g.fillRect(24,24,592,520);}
else{drawRoomContent(S.cam);const c=CAMS[S.cam];g.fillStyle='rgba(0,0,0,0.55)';g.fillRect(24,24,592,36);txt('КАМЕРА '+c.id+' — '+c.name,40,48,15,'#cfd3da','left');txt(hourStr(),600,48,15,'#cfd3da','right');if(frame%60<32){g.fillStyle='#ff2a2a';g.beginPath();g.arc(560,84,6,0,7);g.fill();txt('REC',585,90,13,'#ff6a6a','left');}g.fillStyle='rgba(255,255,255,0.04)';g.fillRect(24,(T*120)%620-60,592,60);}

function renderNight(){if(S.tablet)renderTablet();else renderOffice();drawStatic(S.izig.ph==='hack'?0.09:0.05);vign();hud();if(S.izig.ph==='hack'&&frame%30<15)txt('БОЕВОЙ ПУБЕРТАТ ПОВЫШЕН',480,110,15,'#ff6a5a');for(const t of toasts){g.globalAlpha=Math.min(1,t.d);g.fillStyle='rgba(0,0,0,0.7)';g.font='bold 15px "Courier New",monospace';const wd=g.measureText(t.t).width;rr(g,480-wd/2-14,80,wd+28,30,6);g.fill();g.fillStyle='#ffd98a';g.textAlign='center';g.fillText(t.t,480,100);g.globalAlpha=1;}callIcon();}

function upBin(dt,hack){const b=S.bin,m=hack?1.55:1;if(b.pos<3){b.t-=dt*m;if(b.t<=0){if(Math.random()<0.5+night*0.06){b.pos++;thump();if(b.pos===3){b.atT=0;b.banged=false;noiseFx(0.5,0.12,220,1);}}b.t=binInt();}}else{b.atT+=dt;if(S.doorL){if(b.atT>1.4){if(!b.banged){b.banged=true;bangDoor();}if(b.atT>3){b.pos=Math.random()<0.5?0:1;b.t=binInt()+5;}}}else{const need=Math.max(1.5,3.6-night*0.18)+(S.tablet?1.1:0);if(b.atT>need)jump('bin');}}}
function upShlep(dt,hack){const p=S.shlep,m=hack?1.55:1;if(p.pos<2){p.t-=dt*m;if(p.t<=0){if(Math.random()<0.55){p.pos++;if(p.pos===2){p.ventT=0;metal();toast('В ЛЮКЕ ШЕЛЕСТ...');}else{thump();if(!p.w1){p.w1=true;toast('Шлепандрей в вентиляции.');}}}p.t=shlepInt();}}else{p.scr-=dt;if(p.scr<=0){p.scr=0.75;scratchS();}if(S.hatch){p.ventT+=dt;if(p.ventT>4){p.pos=0;p.t=shlepInt()+8;p.w1=false;}}else{p.ventT+=dt;if(p.ventT>Math.max(2.8,6-night*0.35))jump('shlep');}}}
function upPalek(dt){const p=S.palek;if(p.st==='dance'){const watched=S.tablet&&S.cam===5&&S.izig.ph!=='hack';if(watched)p.k=Math.max(0,p.k-14*dt);else{p.k=Math.min(100,p.k+(1.4+night*0.75)*dt);if(p.k>80&&!p.warn){p.warn=true;toast('Палек наливает второй стакан...');}}if(p.k<50)p.warn=false;if(p.k>=100){p.st='rush';p.rt=0;runSteps();toast('ТОПОТ В ВОСТОЧНОМ КОРИДОРЕ!');}}else{p.rt+=dt;if(p.rt>=Math.max(1.3,2.3-night*0.08)){if(S.doorR){bangDoor();p.st='dance';p.k=18;toast('Палек ушёл танцевать.');}else jump('palek');}}}
function upIzig(dt){const z=S.izig;if(z.ph==='idle'){z.t-=dt;if(z.t<=0){z.ph='hack';z.ht0=z.ht=9+Math.random()*6;z.gr=4.5;z.at=0;S.tablet=true;staticFx();toast('ПЛАНШЕТ ВЗЛОМАН!');}}else{z.ht-=dt;z.gr-=dt;if(z.gr<=0&&(!S.doorL||!S.doorR)){jump('izig');return;}if(z.ht<=0){z.ph='idle';z.t=45-night*4+Math.random()*15;toast('СИСТЕМЫ ВОССТАНОВЛЕНЫ');}}}
function upPup(dt){const p=S.pup;if(!p.on){if(S.hour>=4)p.on=true;if(!p.on)return;}p.lt-=dt;if(p.lt<=0){p.lt=7+Math.random()*6;laugh();}if(p.pos<2){const m=S.izig.ph==='hack'?1.5:1,sp=S.tablet?0.35:1;p.t-=dt*m*sp;if(p.t<=0){if(Math.random()<0.6){p.pos++;thump();if(p.pos===2)p.atT=0;}p.t=pupInt();}}else{p.atT+=dt;if(S.doorR){if(p.atT>2.6){p.pos=Math.random()<0.5?0:1;p.t=pupInt()+6;laugh();}}else if(p.atT>Math.max(2,4.4-night*0.2))jump('pup');}}
function startBlackout(){S.blackout=true;S.doorL=S.doorR=false;S.lightL=S.lightR=false;S.hatch=false;S.tablet=false;setBuzz(false);stopFan();S.boT=6+Math.random()*10;S.tuneT=0.5;S.tuneI=0;laugh();}
function upBlackout(dt){S.boT-=dt;S.tuneT-=dt;if(S.tuneT<=0){S.tuneT=0.42;tone(TUNE[S.tuneI++%TUNE.length],0.4,'triangle',0.12);}if(S.boT<=0)jump('pup');}
function upNight(dt){if(call.active&&!call.tts){call.t+=dt;if(call.t>4.6){call.t=0;if(call.line<CALL_LINES.length-1)call.line++;}}for(const t of toasts)t.d-=dt;toasts=toasts.filter(t=>t.d>0);S.elapsed+=dt;if(night===1){if(S.elapsed>14&&!S.tut1){S.tut1=true;toast('ПРОБЕЛ — камеры. Танцпол, люк, энергия.',5);}if(S.elapsed>32&&!S.tut2){S.tut2=true;toast('Макароны ограничены. Не бей по люку в пустоту.',4);}}S.hourT+=dt;if(S.hourT>=HOUR_LEN){S.hourT=0;S.hour++;if(S.hour>=6){winNight();return;}}const target=(0.5-mouse.x/W)*2*PANMAX;S.pan+=(target-S.pan)*Math.min(1,dt*7);S.creakT-=dt;if(S.creakT<=0){S.creakT=9+Math.random()*14;tone(70+Math.random()*40,0.5,'triangle',0.06,55);}if(S.blackout){upBlackout(dt);return;}S.usage=1+(S.doorL?1:0)+(S.doorR?1:0)+((S.lightL||S.lightR)?1:0)+(S.hatch?1:0)+(S.tablet?1:0);S.power-=dt*(0.08*S.usage+0.004*night);if(S.power<=0){S.power=0;startBlackout();return;}const hack=S.izig.ph==='hack';upBin(dt,hack);if(state!=='night')return;upShlep(dt,hack);if(state!=='night')return;upPalek(dt);if(state!=='night')return;upIzig(dt);if(state!=='night')return;upPup(dt);if(state!=='night')return;if(hack){S.izig.at-=dt;if(S.izig.at<=0){S.izig.at=0.5;alt=!alt;alarmBeep(alt);}}if(S.tablet&&S.cam===5&&S.palek.st==='dance'&&!hack){S.palek.jt-=dt;if(S.palek.jt<=0){S.palek.jt=0.22;tone(JN[S.palek.ji++%JN.length],0.18,'square',0.08);}}}

function renderMenu(){g.fillStyle='#000';g.fillRect(0,0,W,H);const gr=g.createRadialGradient(770,300,40,770,300,340);gr.addColorStop(0,'rgba(140,100,40,0.16)');gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(0,0,W,H);g.globalAlpha=0.9;drawFan(770,300,120,fanA);g.globalAlpha=1;if(eyeT>0){eyeT-=0.016;g.globalAlpha=Math.min(0.5,eyeT);drawBinEyes(770,290,0.4);g.globalAlpha=1;}else if(Math.random()<0.003)eyeT=0.4;
menuGlitch-=0.016;const gx=menuGlitch>0?(Math.random()-0.5)*8:0;
txt('ПЯТЬ',70+gx,110,36,'#d6d6d6','left','bold','Georgia,serif');txt('НОЧЕЙ',70+gx,152,36,'#d6d6d6','left','bold','Georgia,serif');txt('С ВОЗДУХАНЧИКАМИ',70+gx,192,26,'#a8a8a8','left','bold','Georgia,serif');
const items=[['Новая игра',()=>startNight(1),true],['Продолжить',saveNight>1?()=>startNight(saveNight):null,saveNight>1]];
items.forEach((it,i)=>{const y=320+i*46;const hov=it[2]&&mouse.x>=60&&mouse.x<=400&&mouse.y>=y-26&&mouse.y<=y+10;if(hov)hoverAny=true;if(it[2])uiButtons.push({x:60,y:y-26,w:340,h:36,cb:it[1]});g.font='bold 24px "Courier New",monospace';g.textAlign='left';g.fillStyle=it[2]?(hov?'#fff':'#9aa0ab'):'#43464e';g.fillText((hov?'>> ':'   ')+it[0],60,y);if(!it[2]){g.font='12px "Courier New",monospace';g.fillStyle='#43464e';g.fillText('нет записи',260,y);}});
if(Math.random()<0.97)txt('© ВОЗДУХАНЧИКИ ENTERTAINMENT',20,584,11,'#555','left');if(saveNight>1)txt('Запись: Ночь '+saveNight,940,584,12,'#666','right');drawStatic(0.07);vign();}
function renderIntro(){g.fillStyle='#000';g.fillRect(0,0,W,H);txt('Ночь '+night,480,290,46,'#d6d6d6','center','bold','Georgia,serif');txt('12:00 АМ',480,330,18,'#8a8f99');drawStatic(0.05);}
function renderJump(){g.fillStyle='#000';g.fillRect(0,0,W,H);if(frame%7<1){g.fillStyle='#fff';g.fillRect(0,0,W,H);return;}const ox=(Math.random()-0.5)*26,oy=(Math.random()-0.5)*26;g.save();g.translate(W/2+ox,H/2+oy);const s=3.2+Math.sin(jumpT*40)*0.3;if(killer==='bin')drawBinFace(0,0,s);if(killer==='shlep')drawShlepFace(0,0,s,true);if(killer==='palek')drawPalekFace(0,0,s,T,true);if(killer==='izig')drawIzigFace(0,0,s);if(killer==='pup')drawPupuk(0,0,s,true);g.restore();drawStatic(0.25);}
function renderOver(){g.fillStyle='#000';g.fillRect(0,0,W,H);g.globalAlpha=0.8;if(killer==='bin')drawBinFace(480,90,0.5);if(killer==='shlep')drawShlepFace(480,90,0.5,true);if(killer==='palek')drawPalekFace(480,90,0.5,T,true);if(killer==='izig')drawIzigFace(480,90,0.5);if(killer==='pup')drawPupuk(480,90,0.5,true);g.globalAlpha=1;txt('СМЕНА ПРОВАЛЕНА',480,220,46,'#c22222');txt('ВАС УСТРАНИЛ(А): '+KILLERS[killer],480,262,18,'#8a8f99');wrap(TIPS[killer],240,310,480,20,15,'#8a8f99');uiBtn(320,470,150,50,'ЗАНОВО',()=>startNight(night),{bg:'#1a1d23',fs:16});uiBtn(490,470,150,50,'В МЕНЮ',()=>{stopAll();state='menu';},{bg:'#1a1d23',fs:16});drawStatic(0.1);}
function renderWin(){g.fillStyle='#04060f';g.fillRect(0,0,W,H);g.shadowColor='#fff';g.shadowBlur=30;txt('6:00 УТРА',480,200,64,'#e8e8ee','center','bold','Georgia,serif');g.shadowBlur=0;txt('СМЕНА '+night+' ПРОЙДЕНА',480,260,22,'#8fd8ff');let st='';for(let i=0;i<5;i++)st+=i<night?'★':'☆';txt(st,480,320,30,'#ffd24d');txt(night<5?'Пупук: «Завтра будет хуже.»':'ТЫ ПЕРЕЖИЛ ВСЕ НОЧИ. ВОЗДУХАНЧИКИ ГОРДЯТСЯ ТОБОЙ.',480,370,15,'#8a8f99');if(night<5)uiBtn(320,470,200,50,'СЛЕДУЮЩАЯ НОЧЬ',()=>startNight(night+1),{bg:'#1a1d23',fs:15});uiBtn(night<5?540:405,470,120,50,'В МЕНЮ',()=>{state='menu';},{bg:'#1a1d23',fs:15});drawStatic(0.04);}

cv.addEventListener('pointermove',e=>{const r=cv.getBoundingClientRect();mouse.x=(e.clientX-r.left)/r.width*W;mouse.y=(e.clientY-r.top)/r.height*H;});
cv.addEventListener('pointerdown',e=>{ac();const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;for(let i=uiButtons.length-1;i>=0;i--){const b=uiButtons[i];if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){beep();b.cb();break;}}});
addEventListener('keydown',e=>{if(state!=='night')return;if(e.code==='Space'){e.preventDefault();toggleTablet();}if(e.code==='Digit1')toggleDoor('L');if(e.code==='Digit2')toggleLight('L');if(e.code==='Digit3')throwMac();if(e.code==='Digit4')toggleHatch();if(e.code==='Digit5')toggleLight('R');if(e.code==='Digit6')toggleDoor('R');if(e.code==='KeyX'&&call.active)skipCall();if(e.code==='Escape'){stopAll();state='menu';}});
let last=0;
function loop(ts){requestAnimationFrame(loop);const dt=Math.min(0.05,(ts-last)/1000||0);last=ts;T+=dt;frame++;fanA+=dt*(state==='night'&&S&&!S.blackout?18:9);uiButtons.length=0;hoverAny=false;if(frame%2===0)refreshNoise();
if(state==='menu')renderMenu();
else if(state==='intro'){introT+=dt;renderIntro();if(introT>2.6)enterNight();}
else if(state==='night'){upNight(dt);if(state==='night')renderNight();}
else if(state==='jump'){jumpT+=dt;renderJump();if(jumpT>1.15)state='over';}
else if(state==='over')renderOver();
else if(state==='win')renderWin();
stage.style.cursor=hoverAny?'pointer':'default';}
requestAnimationFrame(loop);
</script>
